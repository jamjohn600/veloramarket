<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Trading Dashboard</title>
    <link rel="stylesheet" href="styles.css">

    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>
    <header>
        <h1>Deriv Trading Dashboard</h1>
        <h1>Welcome</h1>
    </header>

    <main>
        <section id="chart-section">
            <h2>Real-Time Price Chart</h2>

            <!-- Dropdown for Currency Pair Selection -->
            <label for="symbol-select">Select Currency Pair:</label>
            <select id="symbol-select">
                <option value="frxEURUSD" selected>EUR/USD</option>
                <option value="frxGBPUSD">GBP/USD</option>
                <option value="frxUSDJPY">USD/JPY</option>
                <option value="frxAUDUSD">AUD/USD</option>
                <option value="frxUSDCAD">USD/CAD</option>
            </select>

            <!-- TradingView Widget -->
            <div id="tradingview-chart"></div>
        </section>
    </main>

    <script>
        let ws; // WebSocket connection reference

        // Function to initialize WebSocket
        const initializeWebSocket = (symbol) => {
            // Close the existing WebSocket connection if it exists
            if (ws) {
                ws.close();
            }

            // Create a new WebSocket connection
            ws = new WebSocket("wss://ws.binaryws.com/websockets/v3?app_id=64452");

            ws.onopen = () => {
                console.log(`WebSocket connected for symbol: ${symbol}`);
                ws.send(JSON.stringify({
                    "ticks": symbol, // Use the selected symbol
                    "subscribe": 1
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.tick) {
                    const price = data.tick.quote;
                    const timestamp = data.tick.epoch;
                    console.log(`Symbol: ${symbol}, Price: ${price}, Time: ${new Date(timestamp * 1000)}`);
                }
            };

            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
            };

            ws.onclose = () => {
                console.log("WebSocket connection closed");
            };
        };

        // Function to initialize TradingView widget
        const loadTradingViewWidget = (symbol) => {
            document.getElementById("tradingview-chart").innerHTML = ""; // Clear previous widget

            new TradingView.widget({
                container_id: "tradingview-chart",
                width: "100%",
                height: 500,
                symbol: `FX:${symbol.replace("frx", "")}`, // Map the selected symbol to TradingView's format
                interval: "1",
                timezone: "Etc/UTC",
                theme: "light",
                style: "1",
                locale: "en",
                toolbar_bg: "#f1f3f6",
                enable_publishing: false,
                hide_side_toolbar: false,
                save_image: false,
                hideideas: true,
                studies: ["RSI@tv-basicstudies"],
                withdateranges: true,
                allow_symbol_change: true,
                details: false,
                hotlist: false,
                calendar: false
            });
        };

        // Event listener for symbol selection dropdown
        document.getElementById("symbol-select").addEventListener("change", (event) => {
            const selectedSymbol = event.target.value;

            // Update TradingView widget and WebSocket for the new symbol
            loadTradingViewWidget(selectedSymbol);
            initializeWebSocket(selectedSymbol);
        });

        // Load default symbol on page load
        window.addEventListener("load", () => {
            const defaultSymbol = "frxEURUSD";
            loadTradingViewWidget(defaultSymbol);
            initializeWebSocket(defaultSymbol);
        });
    </script>
</body>

</html>
